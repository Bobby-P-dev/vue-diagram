# =================================================================
# Nginx Gateway Configuration for RancangLab Production
# Domains:
# - rancanglab.bby-dev.tech (Frontend Studio SPA)
# - diagram.bby-dev.tech    (Go Backend Core API)
# =================================================================

# 1. Frontend Web Application (rancanglab.bby-dev.tech)
server {
    listen 80;
    server_name rancanglab.bby-dev.tech _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Reverse Proxy for Go Backend API (Same-origin access)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeouts for LLM and CrewAI generation
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    # Vue SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container Healthcheck Endpoint
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
    }
}

# 2. Dedicated Backend API Gateway (diagram.bby-dev.tech)
server {
    listen 80;
    server_name diagram.bby-dev.tech;

    client_max_body_size 50M;

    location / {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeouts for AI streaming & generation
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }
}

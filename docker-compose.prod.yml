services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://diagram.bby-dev.tech/api}
    container_name: diagram_frontend_prod
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
